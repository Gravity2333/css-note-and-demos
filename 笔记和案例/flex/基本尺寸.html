<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            padding: 20px;
            width: 400px;
            height: 100px;
            background-color: lightgray;

            display: flex;
        }

        .box {
            flex-shrink: 0;
            border: 1px solid black;
            height: 100px;
            background-color: lightgoldenrodyellow;
        }

        .box2 {
            flex-shrink: 0;
            border: 1px solid black;
            height: 100px;
            background-color: lightseagreen;
        }
    </style>
    <div class="container">
        <div class="box">这是一行中文</div>
        <div class="box2">可以随意位置换行</div>
    </div>
</body>

</html>
