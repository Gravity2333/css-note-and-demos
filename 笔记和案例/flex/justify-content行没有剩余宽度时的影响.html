<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            margin: 0 auto;
            height: 300px;
            background-color: lightslategray;
            display: flex;
            width: 300px;
            flex-wrap: nowrap;
            align-items: flex-end;
            justify-content: flex-end;
            position: relative;
        }

        .box {
            border: 1px solid black;
            width: 200px;
            height: 90%;
            flex-shrink: 0;
            flex-grow: 1;
            background-color: yellow;
        }
    </style>
    
    <div class="container" >
        <div style="position: absolute;top:0px;color:white">center</div>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>

</html>
