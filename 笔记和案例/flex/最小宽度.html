<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            width: 1000px;
            height: 100px;
            background-color: lightgray;

            display: flex;
        }

        .box {
   
            flex-shrink: 0.5;
            border: 1px solid black;
            flex-basis: 400px;
            overflow: hidden;
            height: 100px;
            background-color: lightgoldenrodyellow;
        }

        .box2 {
            flex-shrink: 0.11;
            border: 1px solid black;
            flex-basis: 2000px;
            height: 100px;
            background-color: lightseagreen;
        }
    </style>
    <div class="container">
        <div class="box"></div>
        <div class="box2"></div>
    </div>
</body>
<!--  -->

</html>
