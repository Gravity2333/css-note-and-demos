<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .a {
            position: relative;
            z-index: 1;
        }

        .b {
            transform: translateX(0);
            background-color: yellow;
        }

        .c {
            position: absolute;
            z-index: 999;
              background-color: pink;
        }
    </style>
    <div class="a">
        <div class="c">C</div>
    </div>
    <div class="b">B</div>
</body>

</html>
