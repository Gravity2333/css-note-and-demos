    <style>
        html,body{
            padding: 0px;
            margin: 0px;
        }
        .conatiner {
            /* width: 200px; */
            display: grid;
            grid-template-columns: repeat(3,200px);

            gap: 0;
            /* 确保无间距 */
            background-color: lightslategray;

            grid-auto-rows: 100px;
            grid-auto-columns: 300px;
            /* grid-auto-flow: column; */
        }

        .box {
            box-sizing: border-box;
            /* 避免 border/padding 增加宽度 */
            border: 1px solid beige;
            /* 移除边框 */
            background-color: lightblue;
        }
    </style>
    <div class="conatiner">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
