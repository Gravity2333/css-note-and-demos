<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .conatiner {
            width: 250px;
            height: 400px;
            background-color: lightblue;

            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: repeat(5, minmax(0px, 1fr));
            justify-content: start;
            gap: 0px;
        }

        .box {
            box-sizing: border-box;
            border: 1px solid black;
            background-color: lightseagreen;
            min-width: 10px;
        }
    </style>
    <div class="conatiner">
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">哈哈哈哈</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
        <div class="box">2</div>
    </div>
</body>

</html>
