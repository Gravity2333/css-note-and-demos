<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            width: 500px;
            height: 500px;
            background-color: lightslategrey;
            display: grid;
            grid-template-columns: repeat(5,100px);
            grid-auto-rows: 100px;
            grid-auto-flow: row;
        }

        .box {
            border: 1px solid black;
        }
    </style>
    <div class="container">
        <div class="box" style="grid-column-start: 2;">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
    </div>
</body>

</html>
