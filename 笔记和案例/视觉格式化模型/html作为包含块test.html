<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            margin: 0px;
            padding: 0px;
        }

        html {
            margin: 20px;
            height: 9999px;
            background-color: lavender;
            background-clip: content-box !important;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: lightskyblue;
            color: lavender;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .absolute {
            width: 200px;
            height: 200px;
            background-color: lightskyblue;
            color: lavender;
            font-size: 20px;
            font-weight: bold;
            text-align: center;

            position: absolute;

            top: 0px;
            left: 250px;
        }

        .fixed {
            width: 200px;
            height: 200px;
            background-color: lightskyblue;
            color: lavender;
            font-size: 20px;
            font-weight: bold;
            text-align: center;

            position: fixed;

            top: 0px;
            left: 500px;
        }
    </style>


    <div class="box">包含块为html</div>
    <div class="absolute">初始包含块</div>
    <div class="fixed">view port</div>
</body>

</html>
