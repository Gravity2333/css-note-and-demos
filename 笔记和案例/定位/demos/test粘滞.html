<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            margin: 300px;
            width: 300px;
            height: 300px;
            background-color: lightblue;
            overflow: auto;
        }

        .box {
            border-top: solid;
            width: 300px;
            height: 10000px;
            background-color: pink;
            text-align: center;
            /* display: flex;
            justify-content: flex-end; */
        }

        .sticky {
           
            display: inline-block;
            height: 100px;
            width: 100%;
            background-color: yellow;
            position: sticky;
            bottom: 0px;
            
        }
    </style>

    <div class="container">
        <div class="box">
            <div style="height: 1000px;"></div>
            <div class="sticky"></div>
        </div>
    </div>
</body>

</html>
