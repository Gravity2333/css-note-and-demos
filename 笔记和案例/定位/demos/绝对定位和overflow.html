<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            margin: 300px;
            width: 300px;
            height: 300px;
            background-color: lightslategrey;
            overflow: hidden;

        }

        .absolute {
            width: 200px;
            height: 200px;
            background-color: lightsalmon;

            position: absolute;
            left: -20px;
            top: -20px;
        }
    </style>

    <div class="container">
        <div style="position: absolute;">
            <div class="absolute"></div>
        </div>
    </div>
</body>

</html>
