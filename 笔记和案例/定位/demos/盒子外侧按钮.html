<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            width: 400px;
            height: 400px;
            background-color: lightblue;
            position: relative;
            text-align: right;
        }


        .btn {
            position: absolute;
            bottom: 0;
            display: inline-block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: lightblue;
            margin-left: 30px;
        }
    </style>
    <div class="container">
        <div class="btn"></div>
    </div>
</body>

</html>
