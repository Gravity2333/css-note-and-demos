<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            width: 500px;
            height: 500px;
            background-color: lightblue;
            position: relative;
        }

        .inner {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100px;
            height: 100px;
            margin: auto;
            background-color: greenyellow;
        }
    </style>
    <div class="container">
        <div class="inner"></div>
    </div>
</body>

</html>
