<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            width: 200px;
            height: 200px;
            background-color: red;
            overflow: hidden;

        }

            width: 400px;
            height: 400px;
            background-color: yellow;
            position: absolute;
        }

    <div class="container">
        <div>

            <div style="width: 400px;height: 400px; position: relative;">
                <div class="box"></div>
            </div>
        </div>

    </div>
</body>

</html>
