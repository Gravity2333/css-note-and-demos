<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            margin: 20px;
        }
        .box{
            font-size: 20px;
            background-color: lightsalmon;
            margin-bottom: 40px;
        }
    </style>
    <div class="box" style="line-height: 0em;">
        line-height: 0em;
    </div>

    <div class="box" style="line-height: 0.2em;">
        line-height: 0.2em
    </div>

    <div class="box" style="line-height: 0.5em;">
        line-height: 0.5em
    </div>

    <div class="box" style="line-height: 0.8em;">
        line-height: 0.8em
    </div>

    <div class="box" style="line-height: 1em;">
        line-height: 1em
    </div>

    <div class="box" style="line-height: 1.2em;">
        line-height: 1.2em
    </div>

    <div class="box" style="line-height: 1.5em;">
        line-height: 1.5em
    </div>

    <div class="box" style="line-height: 2em;">
        line-height: 2em
    </div>
</body>
</html>
