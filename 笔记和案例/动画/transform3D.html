<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .container {
            margin: 300px;
            width: 400px;
            height: 400px;
            background-color: lightslategrey;
            perspective: 400px;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: lightyellow;

            transform: rotateX(30deg)
        }

        .box:hover{
            transform:  rotateX(30deg) scaleZ(222)
        }
    </style>
    <div class="container">
        <div class="box"></div>
    </div>

</body>

</html>
